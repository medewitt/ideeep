[package]
name = "md-compiler"
version = "0.1.0"
edition = "2021"
# Canonical production origin for the built site. Drives canonical URLs,
# Open Graph/Twitter cards, JSON-LD, the sitemap, robots.txt, and the web
# manifest. Change this one line to move the site to a new domain.
# Write it WITHOUT a trailing slash (the generator appends paths).
homepage = "https://id3es.com"

[[bin]]
name = "md-compiler"
path = "src/main.rs"

[dependencies]
pulldown-cmark = "0.9"
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
regex = "1.10"
katex = "0.4"
rusqlite = { version = "0.31", features = ["bundled"] }


# Navbar: four audience-facing groups instead of a long flat list.
#   Program   — what you can study (overview, courses, certificates, short courses)
#   Research  — what the program discovers
#   People    — who to contact
#   Resources — the open learning library (methods, computing, epi, diagnostics, careers)
# The Program dropdown links into sections of the Programs page (which already
# describes every course, certificate, and short course) rather than exposing
# every syllabus in the menu.
navbar_order:
  - Program
  - research
  - people
  - Resources
  - Glossary
  - Search
  - url: https://wakeforestid.com
    text: Home

dropdowns:
  Program:
    Program Overview: programs.html
    Courses & Syllabi: programs.html#curriculum
    Certificates: programs.html#graduate-certificates
    Short Courses: programs.html#short-courses
    Prospective Students: prospective-students.html
  Resources:
    - math
    - programming
    - epidemiology
    - diagnostics
    - writing

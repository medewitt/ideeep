# Glossary of terms used across the site.
#
# Each entry auto-links the FIRST time its term (or an alias) appears in the
# prose of any page, with a hover/focus definition tooltip, and gets an entry on
# the generated /glossary.html page listing every page that discusses it.
#
# Fields:
#   term     (required) canonical display form; also the tooltip/heading label
#   aliases  (optional) other surface forms that should link to this entry
#   short    (required) one-sentence definition (tooltip + glossary page)
#   long     (optional) fuller Markdown definition, shown on the glossary page
#   see      (optional) canonical page for the concept (path under content/)
#
# Matching is case-insensitive and whole-word. Keep aliases specific — a very
# common word will link somewhere on almost every page. A page can opt out of
# auto-linking with `glossary: false` in its front matter.

- term: Basic reproduction number
  aliases: [R0, basic reproductive number]
  short: The average number of secondary infections caused by one infectious individual in a fully susceptible population.
  see: math/reproduction-number-rt.md

- term: Effective reproduction number
  aliases: [Rt, effective reproductive number]
  short: The average number of secondary infections per case at a given time, as susceptibility and interventions change.
  see: math/reproduction-number-rt.md

- term: Serial interval
  aliases: [serial intervals]
  short: The time between symptom onset in an infector and symptom onset in the people they infect.
  see: epidemiology/epidemiological-intervals.md

- term: Generation interval
  aliases: [generation intervals, generation time]
  short: The time between the infection of an infector and the infections they in turn cause.
  see: epidemiology/epidemiological-intervals.md

- term: Incubation period
  aliases: [incubation periods]
  short: The time between infection and the onset of symptoms in an individual.
  see: epidemiology/epidemiological-intervals.md

- term: Latent period
  short: The time between infection and the onset of infectiousness (which may differ from the incubation period).
  see: epidemiology/epidemiological-intervals.md

- term: Compartmental model
  aliases: [compartmental models]
  short: A model that divides a population into states — such as susceptible, infectious, and recovered — and tracks the flows between them.
  see: math/sir.md

- term: Next-generation matrix
  short: A matrix whose dominant eigenvalue gives the basic reproduction number in a structured or multi-type transmission model.
  see: math/next-generation-matrix.md

- term: Neural network
  aliases: [neural networks, artificial neural network]
  short: A model built from layers of simple units, each a weighted sum passed through a nonlinearity, whose weights are learned from data.
  see: math/neural-networks.md

- term: Multilayer perceptron
  aliases: [MLP]
  short: A feedforward neural network of fully connected layers — the basic deep-learning architecture.
  see: math/neural-networks.md

- term: Backpropagation
  short: The chain rule applied layer by layer to compute a neural network's loss gradients efficiently, so its weights can be updated by gradient descent.
  see: math/neural-networks.md

- term: Activation function
  aliases: [activation functions]
  short: The nonlinearity applied to each neuron's weighted input (e.g. sigmoid, tanh, ReLU); without it a network could only represent linear maps.
  see: math/neural-networks.md

- term: Recurrent neural network
  aliases: [recurrent neural networks, RNN]
  short: A network that processes a sequence one step at a time, carrying a hidden state forward as a running summary of what it has seen.
  see: math/recurrent-networks-lstm.md

- term: Long short-term memory
  aliases: [LSTM]
  short: A recurrent-network cell whose forget, input, and output gates protect a long-term memory, letting it learn dependencies across many time steps.
  see: math/recurrent-networks-lstm.md

- term: Convolutional neural network
  aliases: [convolutional neural networks, CNN]
  short: A network that slides small learned filters across an image, building features hierarchically from edges to objects.
  see: math/convolutional-networks-image.md

- term: Autoencoder
  aliases: [autoencoders]
  short: A network trained to compress data through a narrow bottleneck and reconstruct it, so the bottleneck retains only the essential structure.
  see: math/variational-autoencoders.md

- term: Variational autoencoder
  aliases: [variational autoencoders, VAE]
  short: A generative autoencoder that learns a smooth probabilistic latent space by maximizing the ELBO, allowing sampling and anomaly detection.
  see: math/variational-autoencoders.md

- term: Latent space
  short: The low-dimensional space of codes a model compresses data into, where each axis captures a factor of variation.
  see: math/variational-autoencoders.md

- term: Evidence lower bound
  aliases: [ELBO]
  short: A tractable lower bound on the log-likelihood, maximized to train variational models; it trades reconstruction accuracy against a prior-matching penalty.
  see: math/variational-autoencoders.md

- term: Reparameterization trick
  short: Writing a random latent draw as a deterministic function of the distribution's parameters plus fixed noise, so gradients can flow through the sampling step.
  see: math/variational-autoencoders.md

- term: Transfer learning
  short: Reusing a model pre-trained on a large general dataset and fine-tuning it on a smaller task-specific one, so generic features need not be relearned.
  see: math/convolutional-networks-image.md

- term: Transformer
  aliases: [transformers]
  short: A neural architecture that replaces recurrence with attention, letting every element of a sequence attend to every other — the basis of modern foundation models.
  see: math/deep-learning-agentic-models.md

- term: Foundation model
  aliases: [foundation models]
  short: A large model pre-trained on broad data with a self-supervised objective, then adapted to many downstream tasks by fine-tuning or prompting.
  see: math/deep-learning-agentic-models.md

- term: Large language model
  aliases: [large language models, LLM, LLMs]
  short: A foundation model for text, trained to predict tokens over a large corpus and adaptable to summarization, extraction, and drafting.
  see: math/deep-learning-agentic-models.md

- term: Agentic AI
  aliases: [agentic model, agentic models]
  short: A language model placed in a loop with tools, which reasons about a goal, calls tools, observes results, and repeats until a task is done.
  see: math/deep-learning-agentic-models.md

- term: Object detection
  short: A computer-vision task that locates and classifies every instance of a class in an image, drawing a box around each — the basis of counting objects such as cars or cells.
  see: math/remote-sensing-outbreak-detection.md

- term: Remote sensing
  short: Measurement of the physical world at a distance — from satellites, aircraft, drones, or fixed cameras — used in epidemiology for climate, population, and activity proxies.
  see: math/remote-sensing-outbreak-detection.md

- term: Kullback–Leibler divergence
  aliases: [KL divergence, relative entropy]
  short: An asymmetric measure of how one probability distribution differs from another — the expected log-ratio of the two — central to maximum likelihood, variational inference, and information theory.
  see: math/kl-divergence.md

- term: Overfitting
  aliases: [overfit, overfitting]
  short: When a model fits the noise in its training data rather than the underlying signal, generalizing poorly to new data.
  see: math/overfitting-regularization.md

- term: Regularization
  aliases: [regularisation]
  short: Penalizing model complexity (e.g. an L1 or L2 term on the parameters) to reduce overfitting and variance.
  see: math/overfitting-regularization.md

- term: Cross-validation
  aliases: [k-fold cross-validation, cross validation]
  short: Estimating out-of-sample performance by repeatedly training on part of the data and validating on the held-out remainder.
  see: math/overfitting-regularization.md

- term: Bias–variance tradeoff
  aliases: [bias-variance tradeoff, bias–variance decomposition]
  short: The tension between a model too simple to capture the pattern (bias) and one so flexible it fits noise (variance); the best model balances the two.
  see: math/overfitting-regularization.md

- term: Neural ordinary differential equation
  aliases: [neural ODE, neural ODEs]
  short: A model whose dynamics — the right-hand side of an ODE — are a neural network, trained by differentiating through the ODE solver.
  see: math/scientific-machine-learning.md

- term: Physics-informed neural network
  aliases: [PINN, physics-informed neural networks]
  short: A neural network trained to satisfy a known differential equation by adding the equation's residual to its loss, alongside a data-misfit term.
  see: math/scientific-machine-learning.md

- term: Decision tree
  aliases: [decision trees]
  short: A model that predicts by a sequence of yes/no feature splits, partitioning the data into regions with their own predictions.
  see: math/tree-ensembles.md

- term: Random forest
  aliases: [random forests]
  short: An ensemble that averages many decorrelated decision trees, each grown on a bootstrap sample with random feature subsets, to cut variance.
  see: math/tree-ensembles.md

- term: Gradient boosting
  aliases: [gradient-boosted trees, boosting]
  short: An ensemble that builds decision trees sequentially, each fitting the errors of the current model — the workhorse for tabular prediction (XGBoost, LightGBM).
  see: math/tree-ensembles.md

- term: Graph neural network
  aliases: [graph neural networks, GNN, GNNs]
  short: A neural network that learns on graph-structured data by message passing — each node aggregating information from its neighbours.
  see: math/graph-neural-networks.md

- term: Message passing
  short: The core operation of a graph neural network, in which each node updates its state by aggregating transformed messages from its neighbours.
  see: math/graph-neural-networks.md

- term: Self-attention
  aliases: [self attention]
  short: The transformer operation in which every element of a sequence attends to every other, weighting them by learned query–key similarity.
  see: math/transformers-attention.md

- term: SHAP
  aliases: [Shapley values, SHAP values]
  short: A method that attributes a model's prediction to its features using Shapley values from game theory, so contributions sum exactly to the output.
  see: math/interpretability-shap.md

- term: Calibration
  aliases: [calibrated, well-calibrated]
  short: A probabilistic prediction is calibrated when, among cases assigned probability p, a fraction close to p actually occur.
  see: math/uncertainty-calibration-conformal.md

- term: Conformal prediction
  short: A distribution-free method that turns any model into prediction sets guaranteed to contain the truth with a chosen probability under exchangeability.
  see: math/uncertainty-calibration-conformal.md

- term: Epistemic uncertainty
  aliases: [aleatoric uncertainty]
  short: Uncertainty from a model's ignorance, which shrinks with more data — as opposed to aleatoric uncertainty, the irreducible noise in the world.
  long: |
    Epistemic uncertainty comes from a model's ignorance and shrinks as more (or
    more representative) data are gathered; aleatoric uncertainty is the
    irreducible randomness of the world and does not. "Aleatoric" derives from
    the Latin *alea* — a dice game and, by extension, chance or risk — the same
    word in Julius Caesar's "*alea iacta est*" ("the die is cast"), reputedly
    said as he crossed the Rubicon in 49 BC to march on Rome.
  see: math/uncertainty-calibration-conformal.md

- term: Dimensionality reduction
  short: Compressing high-dimensional data into a few informative coordinates that preserve its important structure, for visualization, denoising, or modeling.
  see: math/dimensionality-reduction.md

- term: Principal component analysis
  aliases: [PCA]
  short: A linear dimensionality-reduction method that projects data onto the orthogonal directions of greatest variance, the eigenvectors of its covariance matrix.
  see: math/dimensionality-reduction.md

- term: Manifold learning
  aliases: [t-SNE, UMAP]
  short: Nonlinear dimensionality reduction that unrolls data lying on a curved low-dimensional surface, preserving local neighbourhoods for visualization.
  see: math/dimensionality-reduction.md

- term: Unsupervised learning
  short: Learning structure from data without labels — clustering, dimensionality reduction, density estimation, and anomaly detection.
  see: math/clustering.md

- term: Clustering
  aliases: [cluster analysis]
  short: Grouping observations so that members of a group resemble each other more than members of other groups, without using labels.
  see: math/clustering.md

- term: k-means
  aliases: [k-means clustering]
  short: A clustering method that partitions data into k groups by minimizing each point's squared distance to its cluster mean, favouring spherical clusters.
  see: math/clustering.md

- term: Softmax
  aliases: [softmax function]
  short: A function that turns a vector of real-valued scores into a probability distribution by exponentiating each entry and normalizing them to sum to one — the multi-class generalization of the logistic function.
  long: |
    The softmax maps a vector of scores $z = (z_1, \dots, z_K)$ to probabilities
    $p_i = e^{z_i} / \sum_j e^{z_j}$, which are non-negative and sum to one. It is
    the output layer of multi-class classifiers and multinomial logistic
    regression, and the operation that turns attention scores into weights inside
    a transformer. A temperature $\tau$ (dividing the scores by $\tau$ before
    exponentiating) sharpens the distribution as $\tau \to 0$ and flattens it as
    $\tau \to \infty$. In practice it is computed via the numerically stable
    log-sum-exp trick — subtracting the maximum score before exponentiating — to
    avoid overflow.
  see: math/transformers-attention.md

- term: Analysis of variance
  aliases: [ANOVA]
  short: A method that partitions total variability into between-group and within-group parts and tests their ratio with an F-statistic.
  see: math/anova.md

- term: Split-plot design
  aliases: [split-plot, split-plot designs]
  short: An experiment with two randomization scales — a hard-to-change factor on whole plots and an easier one on sub-plots — giving two error strata.
  see: math/split-plot-designs.md

- term: Repeated measures design
  aliases: [repeated measures, repeated-measures, repeated-measures design]
  short: A design in which the same units are measured under several conditions or times, using each unit as its own control.
  see: math/repeated-measures.md

- term: Crossover design
  aliases: [crossover trial, crossover trials]
  short: A trial in which every subject receives every treatment in sequence, separated by washout, so treatments are compared within subjects.
  see: math/crossover-designs.md

- term: Stepped-wedge design
  aliases: [stepped-wedge trial, stepped wedge]
  short: A cluster trial in which groups cross one-way from control to intervention on a staggered, randomized schedule until all are exposed.
  see: math/stepped-wedge-designs.md

- term: Balanced incomplete block design
  aliases: [BIBD]
  short: A blocked design whose blocks are too small to hold every treatment, arranged so every pair of treatments appears together equally often.
  see: math/balanced-incomplete-block-designs.md

- term: Latin square
  aliases: [Latin square design, Latin squares]
  short: A t×t layout in which each treatment appears once in every row and every column, controlling two blocking factors at once.
  see: math/latin-square-designs.md

- term: Meta-analysis
  aliases: [meta-analyses]
  short: A statistical synthesis that pools estimates from multiple studies into one overall estimate, weighting each by its precision.
  see: math/meta-analysis.md

- term: Prediction interval
  aliases: [prediction intervals]
  short: In a random-effects meta-analysis, the interval within which the true effect of a new study is expected to fall — reflecting between-study heterogeneity, not just uncertainty in the mean.
  see: math/meta-analysis.md

- term: Bland–Altman plot
  aliases: [Bland-Altman plot, Bland–Altman, Bland-Altman analysis]
  short: A plot of the difference between two measurement methods against their mean, used to assess agreement via the bias and limits of agreement.
  see: math/bland-altman.md

- term: Limits of agreement
  short: In a Bland–Altman analysis, the interval (mean difference ± 1.96 SD of the differences) within which 95% of the differences between two methods are expected to lie.
  see: math/bland-altman.md

- term: Serial dilution
  aliases: [serial dilutions]
  short: A stepwise dilution of a sample by a fixed factor at each step, producing a geometric series of concentrations used for titration and standard curves.
  see: math/dilutions-and-titers.md

- term: Titer
  aliases: [titre, endpoint titer, neutralization titer]
  short: The reciprocal of the highest (or 50%) dilution of a sample that still produces a defined effect, such as neutralization or agglutination.
  see: math/dilutions-and-titers.md

- term: Standard curve
  aliases: [calibration curve]
  short: A curve fit to standards of known concentration (often a four-parameter logistic) and inverted to read the concentration of unknowns from their assay signal.
  see: math/dilutions-and-titers.md
